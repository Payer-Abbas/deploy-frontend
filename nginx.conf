server {
    listen 80;
    server_name amajeed.site www.amajeed.site;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name amajeed.site www.amajeed.site;

    # SSL certificate files (mounted from host via docker volume)
    ssl_certificate     /etc/letsencrypt/live/amajeed.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amajeed.site/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Serve the React build
    root /usr/share/nginx/html;
    index index.html;

    # React Router – send all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}